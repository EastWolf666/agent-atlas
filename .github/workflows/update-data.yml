name: Update Data Daily

# 每天北京时间凌晨 6:00 抓一次数据。
# cron 用 UTC：北京时间 6:00 = UTC 前一天 22:00。
# 注意 GitHub Actions 的定时任务实际执行常延迟 5-15 分钟（高峰期更久），
# 实际落点在 5:55-6:15 之间，这是平台行为，无法精确到点。
on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch: # 允许手动重跑

permissions:
  contents: write # 推 main 所需

# 同一时间只跑一个实例。若上一次还没跑完就跳过本次，
# 避免并发推同一个分支产生冲突。
concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # 抓三个源 + 刷新存量，20 分钟足够；防卡死

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 关键：必须完整历史，否则水位线文件可能读不到，
          # 且后续 commit 需要历史来计算diff
          fetch-depth: 0
          # 让 GITHUB_TOKEN 留在 git config 里，推送时不用再配认证
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 抓取脚本零依赖，不需要 npm ci——省时间也省供应链风险
      - name: Fetch latest data
        run: node scripts/fetch.mjs

      # schema 校验：fetch.mjs 内部已校验过一次，
      # 这里独立再跑一遍作为第二道防线（防脚本本身有 bug）
      - name: Validate data schema
        run: node scripts/lib/schema.mjs --check src/data/agents.json

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet -- src/data/ data/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "今日无数据变更"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "检测到变更："
            git diff --stat -- src/data/ data/
          fi

      # 注意：这里绝不能用 [skip ci]。
      # 那样会连带跳过 deploy.yml 的 Pages 部署，数据改了但线上不更新。
      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name 'agent-atlas-bot'
          git config user.email 'agent-atlas-bot@users.noreply.github.com'
          # 本地环境实测 git push 到 github.com 会遇到 GnuTLS 连接错误，
          # 显式降到 HTTP/1.1 规避；workflow 内一般不会触发，留作兜底
          git config http.version HTTP/1.1
          git add src/data/ data/
          git commit -m "chore(data): 每日自动更新 $(date -u +'%Y-%m-%d')"
          git push origin HEAD:main

      - name: Probe production site
        # 探活：确认站点没挂。
        #
        # 注意：不能用「grep 页面上的条数」这种做法——
        # 这是个 SPA，条数由 React 渲染后才出现在 DOM 里，
        # curl 拿到的静态 HTML 里根本没有这段文案（已实测确认）。
        # 页面级的一致性检查交给 Playwright 回归测试，不塞进这个每日 job。
        #
        # 这里只做三件 curl 能真正验证的事：
        #   1. 首页 200
        #   2. 关键静态资源 200（路径带 BASE_PATH，漏了会 404）
        #   3. 构建产物里确实包含本次数据（避免 Pages 缓存了旧版本）
        if: always()
        run: |
          BASE="https://eastwolf666.github.io/agent-atlas/"
          REPO_TOTAL=$(node -e "console.log(require('./src/data/agents.json').length)")
          echo "仓库数据: ${REPO_TOTAL} 条"

          # 1) 首页可达
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$BASE")
          if [ "$code" != "200" ]; then
            echo "::error::线上首页不可达：HTTP $code"
            exit 1
          fi

          # 2) 入口 JS/CSS 可加载（BASE_PATH 配错时这里会404，是真实故障模式）
          entry=$(curl -s --max-time 20 "$BASE" | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -1)
          if [ -z "$entry" ]; then
            echo "::warning::未能从首页解析出入口 JS 名称，页面结构可能已变更"
          else
            js_code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${BASE}${entry}")
            if [ "$js_code" != "200" ]; then
              echo "::error::入口 JS 不可达（${entry}）：HTTP ${js_code}，请检查 BASE_PATH 配置"
              exit 1
            fi
            echo "✅ 首页 200，入口 JS ${entry} 可加载"
          fi